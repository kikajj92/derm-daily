<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>피부과 1차 데일리 모의고사</title>
<meta name="description" content="매일 새로 만드는 피부과 전문의 1차 모의고사">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="피부과 1차">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111216" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: 시험지(본문) + OMR 답안지(우측 고정 열). 시험 중에는 상단 탭을 숨기고 시험지만 남긴다. */
:root{
  --paper:#f5f5f2;
  --sheet:#ffffff;
  --ink:#1a1c21;
  --ink-2:#575c66;
  --ink-3:#8b909a;
  --rule:#e2e0db;
  --rule-2:#eeece8;
  --omr:#cf3a55;
  --omr-soft:#fbe6ea;
  --omr-line:#eeb3be;
  --mark:#17191e;
  --ok:#2a7a4c;
  --ok-soft:#e3f2e9;
  --nov:#2b6f8c;
  --nov-soft:#e1eff5;
  --warn:#a86a12;
  --focus:#2f6fdb;
  --shade:rgba(20,22,28,.45);
  --shadow:0 1px 0 rgba(0,0,0,.03),0 10px 28px -16px rgba(20,20,30,.22);
  --f-serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --f-sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111216;--sheet:#1a1c21;--ink:#ecebe7;--ink-2:#a8acb5;--ink-3:#7b808a;--rule:#2c2f36;--rule-2:#24262c;
  --omr:#ff7189;--omr-soft:#3a1d25;--omr-line:#6e3341;--mark:#ecebe7;--ok:#62c98e;--ok-soft:#18301f;--nov:#6cb8d8;--nov-soft:#14303b;--warn:#e3a64d;--focus:#7aa7ff;--shade:rgba(0,0,0,.6);
  --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 28px -16px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111216;--sheet:#1a1c21;--ink:#ecebe7;--ink-2:#a8acb5;--ink-3:#7b808a;--rule:#2c2f36;--rule-2:#24262c;
  --omr:#ff7189;--omr-soft:#3a1d25;--omr-line:#6e3341;--mark:#ecebe7;--ok:#62c98e;--ok-soft:#18301f;--nov:#6cb8d8;--nov-soft:#14303b;--warn:#e3a64d;--focus:#7aa7ff;--shade:rgba(0,0,0,.6);
  --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 28px -16px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 72px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-size:13px;letter-spacing:.08em;font-weight:600;color:var(--ink-2)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:1120px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:20px;min-height:56px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-family:var(--f-serif);font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand span{font-size:13px;color:var(--ink-2)}
.brand i{font-style:normal;display:inline-grid;place-items:center;width:16px;height:21px;border:1.5px solid var(--omr);border-radius:50%;color:var(--omr);font:600 10px var(--f-mono);transform:translateY(3px)}
.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto}
.tab{background:none;border:0;padding:16px 12px 14px;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--omr)}

/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.red{background:var(--omr);border-color:var(--omr);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-size:13px;font-weight:500;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.chip b{font-family:var(--f-mono);font-weight:600}
.badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 7px;border-radius:4px;border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap}
.badge.red{border-color:var(--omr-line);color:var(--omr);background:var(--omr-soft)}
.badge.ok{border-color:transparent;color:var(--ok);background:var(--ok-soft)}
.badge.nov{border-color:transparent;color:var(--nov);background:var(--nov-soft)}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:10px}
.sec{display:grid;gap:12px;margin-top:36px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.note{font-size:13px;color:var(--ink-2)}
.empty{padding:28px 20px;text-align:center;color:var(--ink-2);border:1px dashed var(--rule);border-radius:10px}

/* today */
.today{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0;overflow:hidden}
.today-main{padding:26px 28px;display:grid;gap:16px;align-content:start}
.today-side{padding:26px 28px;border-left:1px solid var(--rule);background:var(--rule-2);display:grid;gap:18px;align-content:start}
.today-date{font-family:var(--f-mono);font-size:13px;color:var(--omr);font-weight:600;letter-spacing:.04em}
.today-title{font-family:var(--f-serif);font-size:28px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.today-sub{color:var(--ink-2);max-width:56ch}
.big-score{font-family:var(--f-mono);font-size:44px;font-weight:600;line-height:1;letter-spacing:-.02em}
.big-score small{font-size:18px;color:var(--ink-3);font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.spark{width:100%;height:64px;display:block}
.spark .ln{fill:none;stroke:var(--ink);stroke-width:1.6}
.spark .ar{fill:var(--omr-soft)}
.spark .dt{fill:var(--omr)}
.spark .gd{stroke:var(--rule);stroke-width:1}
.spark text{fill:var(--ink-3);font:10px var(--f-mono)}

/* progress */
.prog-top{display:flex;align-items:baseline;gap:10px}
.prog-n{font-family:var(--f-mono);font-size:34px;font-weight:600;line-height:1}
.bar{height:6px;border-radius:3px;background:var(--rule-2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--omr);border-radius:3px;transition:width .4s}
.batches{display:grid;gap:6px;font-size:13px;max-height:280px;overflow:auto;padding-right:4px}
.bt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule-2)}
.bt-k{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.bt-d{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-size:12px;font-weight:600;font-family:var(--f-mono)}
.st.run{color:var(--omr)} .st.done{color:var(--ok)} .st.err{color:var(--warn)} .st.wait{color:var(--ink-3)}
.dotpulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--omr);margin-right:6px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.dotpulse{animation:none}.bar > i{transition:none}}

/* blueprint */
.bp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
.bp-r{display:grid;grid-template-columns:28px minmax(0,1fr) 84px 26px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule-2);font-size:13.5px}
.bp-c{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.bp-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bp-bar{height:8px;background:var(--rule-2);border-radius:2px;overflow:hidden;display:flex}
.bp-bar i{display:block;height:100%;background:var(--ink)}
.bp-bar u{display:block;height:100%;background:var(--omr)}
.bp-bar b{display:block;height:100%;background:var(--nov)}
.bp-n{font-family:var(--f-mono);font-weight:600;text-align:right}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}

/* history + chapter stats */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
.hist{display:grid}
.hr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule-2)}
.hr-t{min-width:0}
.hr-t div{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hr-t small{color:var(--ink-3);font-size:12px}
.hr-s{font-family:var(--f-mono);font-weight:600;font-size:15px;text-align:right;min-width:56px}
.acc-r{display:grid;grid-template-columns:minmax(0,1fr) 110px 74px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule-2);font-size:13.5px}
.acc-r .bp-bar u{background:var(--omr)}
.acc-r .bp-bar i{background:var(--ok)}
.acc-v{font-family:var(--f-mono);text-align:right;font-size:12.5px}

/* exam */
.exam-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.exam-bar-in{max-width:1180px;margin:0 auto;padding-inline:16px;min-height:58px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.eb-title{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.eb-title small{display:block;font-weight:400;font-size:12px;color:var(--ink-3)}
.timer{font-family:var(--f-mono);font-size:22px;font-weight:600;letter-spacing:.02em;padding:2px 10px;border-radius:6px}
.timer.low{color:var(--omr);background:var(--omr-soft)}
.exam-grid{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 90px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.paper{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:30px 34px 22px;box-shadow:var(--shadow);min-width:0}
.q-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.q-no{font-family:var(--f-mono);font-weight:600;font-size:15px;position:relative;display:inline-block}
.q-stem{font-family:var(--f-serif);font-size:17px;line-height:1.85;margin:0 0 18px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:0 0 20px}
.fig{margin:0;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--rule-2);display:flex;flex-direction:column}
.fig figcaption{font-size:12px;font-weight:600;color:var(--ink-2);padding:7px 10px;border-bottom:1px solid var(--rule);background:var(--sheet);display:flex;justify-content:space-between;gap:8px}
.fig figcaption span{font-family:var(--f-mono);color:var(--omr)}
.fig .desc{padding:12px 14px;font-family:var(--f-serif);font-size:14.5px;line-height:1.75;white-space:pre-wrap}
.fig button.zoom{border:0;padding:0;background:#000;display:block;width:100%}
.fig img{display:block;width:100%;max-height:340px;object-fit:contain;background:#000}
.fig.missing .desc{font-family:var(--f-sans);font-size:13px;color:var(--ink-3)}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;width:100%;text-align:left;padding:10px 12px;border:1px solid transparent;border-radius:8px;background:transparent;font-family:var(--f-serif);font-size:16px;line-height:1.65}
.opt:hover{background:var(--rule-2)}
.opt .ol{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--omr-line);display:grid;place-items:center;font:600 13px var(--f-sans);color:var(--omr);margin-top:1px}
.opt.sel{border-color:var(--ink);background:var(--rule-2)}
.opt.sel .ol{background:var(--mark);border-color:var(--mark);color:var(--sheet)}
.opt .ot{overflow-wrap:anywhere}
.q-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--rule-2)}
.flagbtn[aria-pressed="true"]{color:var(--omr);border-color:var(--omr-line);background:var(--omr-soft)}

/* OMR */
.omr{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);background:var(--sheet);border:1.5px solid var(--omr-line);border-radius:6px;max-height:calc(100vh - 100px);display:flex;flex-direction:column}
.omr-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px;border-bottom:1.5px solid var(--omr-line);color:var(--omr)}
.omr-h b{font-size:14px;letter-spacing:.2em}
.omr-h span{font:500 12px var(--f-mono)}
.omr-body{overflow:auto;padding:6px 8px 10px;display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.omr-col{display:grid;align-content:start}
.or{display:grid;grid-template-columns:30px repeat(5,1fr);align-items:center;height:22px;gap:2px}
.or:nth-child(5n){border-bottom:1px solid var(--omr-line);height:24px;padding-bottom:2px}
.or-n{border:0;background:none;padding:0;font:600 11px var(--f-mono);color:var(--omr);text-align:right;padding-right:6px;height:100%}
.or.cur{background:var(--omr-soft);border-radius:3px}
.or.flag .or-n{text-decoration:underline;text-decoration-thickness:2px}
.bub{width:13px;height:17px;border-radius:50%;border:1px solid var(--omr-line);display:grid;place-items:center;font:500 8.5px var(--f-mono);color:var(--omr);background:transparent;padding:0;justify-self:center}
.bub.on{background:var(--mark);border-color:var(--mark);color:transparent}
.omr-f{border-top:1.5px solid var(--omr-line);padding:8px 12px;font-size:12px;color:var(--ink-2);display:flex;gap:12px;flex-wrap:wrap}
.omr-toggle{display:none}
.omr-close{display:none}
.exam-dock{display:none}
.omr-backdrop{display:none}

/* review */
.score-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;padding:24px 26px;align-items:center}
.rq{padding:24px 26px;display:grid;gap:14px}
.rq + .rq{border-top:1px solid var(--rule)}
.rq-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rq-h .q-no{font-size:16px}
.q-no.ok::after{content:"";position:absolute;left:-9px;top:-7px;width:calc(100% + 18px);height:calc(100% + 14px);border:2.5px solid var(--omr);border-radius:50%;transform:rotate(-8deg)}
.q-no.bad::after{content:"";position:absolute;left:-6px;top:50%;width:calc(100% + 14px);height:2.5px;background:var(--omr);transform:rotate(-58deg)}
.ropt{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:start;padding:8px 12px;border-radius:8px;font-family:var(--f-serif);font-size:15.5px;line-height:1.65}
.ropt .ol{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--omr-line);display:grid;place-items:center;font:600 12px var(--f-sans);color:var(--omr)}
.ropt.right{background:var(--ok-soft)}
.ropt.right .ol{border-color:var(--ok);color:var(--ok)}
.ropt.mine .ol{background:var(--mark);border-color:var(--mark);color:var(--sheet)}
.ropt .tag{font:600 11px var(--f-sans);letter-spacing:.04em;padding-top:4px;white-space:nowrap}
.ropt.right .tag{color:var(--ok)}
.ropt.mine.wrongpick .tag{color:var(--omr)}
.expl{display:grid;gap:8px;padding:14px 16px;border-radius:8px;background:var(--rule-2);font-size:14.5px;line-height:1.75}
.expl .t{white-space:pre-wrap}
.expl .pt{font-weight:600}
.expl .pt::before{content:"핵심  ";color:var(--omr);font-size:12px;letter-spacing:.06em}
.expl .rf{font-size:12.5px;color:var(--ink-3)}
.ai{border:1px solid var(--rule);border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.75;white-space:pre-wrap;background:var(--sheet)}
.ai .who{display:block;font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--ink-3);margin-bottom:4px;white-space:normal}
.askrow{display:flex;gap:8px}
.askrow input{flex:1;min-width:0;padding:9px 12px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select.sel{padding:6px 10px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-size:13px;max-width:100%}

/* list cards (기출, 오답) */
.list{display:grid}
.lc{padding:22px 24px;display:grid;gap:12px;border-bottom:1px solid var(--rule)}
.lc:last-child{border-bottom:0}
.lc-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lc .q-stem{font-size:16px;margin:0}
.lc .opt{font-size:15px;padding:7px 10px}

/* settings */
.set{display:grid;gap:0}
.set-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 22px;border-bottom:1px solid var(--rule-2)}
.set-r:last-child{border-bottom:0}
.set-r p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:7px 12px;font-size:13px;font-weight:500;color:var(--ink-2)}
.seg button + button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
input.num{width:84px;padding:7px 10px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-mono);text-align:right}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:var(--shade);display:grid;place-items:center;padding:16px}
.dlg{background:var(--sheet);border-radius:12px;border:1px solid var(--rule);max-width:440px;width:100%;padding:24px;display:grid;gap:14px;box-shadow:var(--shadow)}
.dlg h3{font-size:18px}
.dlg.img{max-width:min(1100px,100%);padding:10px;background:#000;border-color:#000}
.dlg.img img{width:100%;max-height:82vh;object-fit:contain;display:block}

<body>
<div id="app"></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>
<script>
(() => {
'use strict';
const CH = {"1": "피부의 구조와 기능", "2": "피부조직병리학", "3": "피부의 증상, 징후와 진단", "4": "피부면역학", "5": "가려움증", "6": "유전피부질환", "7": "광의학", "8": "물리적 피부질환과 스포츠피부질환", "9": "습진", "10": "직업피부질환", "11": "약물발진, 홍반 및 두드러기", "12": "구진인설질환", "13": "수포질환", "14": "감염피부질환", "15": "피부부속기질환", "16": "색소이상증", "17": "피부혈관질환", "18": "결합조직질환", "19": "피하지방질환", "20": "점막질환", "21": "임신피부질환", "22": "신생아피부질환", "23": "피부노화", "24": "결핍질환, 대사이상, 포르피린증", "25": "내분비질환, 피부점액증, 손발바닥각질피부증, 진피결합조직질환", "26": "모반과 종양", "27": "피부질환의 치료", "28": "피부미용학"};
const LET = ['가', '나', '다', '라', '마'];
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const chName = c => CH[String(c)] || ('Chapter ' + c);
const pad = (n, w = 2) => String(n).padStart(w, '0');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const dowOf = s => { const [y, m, d] = s.split('-').map(Number); return '일월화수목금토'[new Date(y, m - 1, d).getDay()]; };
const fmtDate = s => { const [y, m, d] = s.split('-').map(Number); return `${y}. ${m}. ${d}. (${dowOf(s)})`; };
const fmtTime = sec => { sec = Math.max(0, Math.round(sec)); return pad(Math.floor(sec / 60)) + ':' + pad(sec % 60); };
const clone = o => JSON.parse(JSON.stringify(o));
const examTitle = e => { if (e.kind === 'unit') return `${e.ch}장` + (e.parts > 1 ? ` (${e.part}/${e.parts})` : ''); if (e.title) return e.title; const [y, m, d] = e.date.split('-').map(Number); const k = (e.id.match(/-(\d)$/) || [])[1]; return `${m}월 ${d}일 (${dowOf(e.date)})${k ? ' ' + k + '회차' : ''}`; };

/* ---------- local storage (records live on this device) ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('dd:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('dd:' + k, JSON.stringify(v)); return true; } catch { toast('이 기기 저장 공간이 부족해요. 설정에서 기록을 내보낸 뒤 오래된 오답을 정리해 주세요.'); return false; } },
  del(k) { try { localStorage.removeItem('dd:' + k); } catch {} },
  keys(pre) { const out = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('dd:' + pre)) out.push(k.slice(3)); } } catch {} return out; },
};

/* ---------- encryption (password → PBKDF2 → AES-GCM) ---------- */
let KEY = null;
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => btoa(String.fromCharCode(...u));
async function deriveRaw(pw) {
  const salt = await (await fetch('data/salt.json', { cache: 'no-cache' })).json();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64d(salt.salt), iterations: salt.iter }, base, 256));
}
const importKey = raw => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
async function decBuf(buf) {
  const u = new Uint8Array(buf);
  if (u[0] !== 68 || u[1] !== 68 || u[2] !== 49) throw new Error('암호화 파일이 아니에요');
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(3, 15) }, KEY, u.slice(15));
}
async function fetchDec(url, json = true, opts) {
  const r = await fetch(url, opts); if (!r.ok) throw new Error('HTTP ' + r.status);
  const p = await decBuf(await r.arrayBuffer());
  return json ? JSON.parse(new TextDecoder().decode(p)) : p;
}
const IMG = new Map();
const toDataUrl = buf => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(new Error('읽기 실패')); fr.readAsDataURL(new Blob([buf], { type: 'image/jpeg' })); });
function imgUrl(name) {
  if (!IMG.has(name)) IMG.set(name, (async () => {
    let r;
    try { r = await fetch('data/img/' + encodeURIComponent(name) + '.enc'); } catch { throw new Error('인터넷 연결'); }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    let plain; try { plain = await decBuf(await r.arrayBuffer()); } catch { throw new Error('복호화 실패'); }
    return toDataUrl(plain);
  })().catch(e => { IMG.delete(name); throw e; }));
  return IMG.get(name);
}
function hydrateImages(root = document) {
  root.querySelectorAll('img[data-enc]:not([src]):not([data-busy])').forEach(img => {
    img.dataset.busy = '1';
    imgUrl(img.dataset.enc).then(u => { img.src = u; const z = img.closest('[data-act="zoom"]'); if (z) z.dataset.src = u; })
      .catch(e => { const f = img.closest('figure'); if (f) f.insertAdjacentHTML('beforeend', `<div class="desc" style="font-size:13px">사진을 불러오지 못했어요 (${esc(e.message)}). <button class="btn sm" data-act="img-retry">다시 시도</button></div>`); img.remove(); });
  });
}

/* ---------- state ---------- */
const S = {
  tab: 'today', view: null, locked: true, index: null, indexErr: null, exams: new Map(),
  cur: null, rec: null, qs: [], qi: 0, rf: 'wrong', nf: 'all', nPick: {},
  settings: Object.assign({ timeMin: 100 }, LS.get('settings', {})),
  notes: LS.get('notes', []),
};
const recOf = id => LS.get('rec:' + id, null);
const allRecs = () => LS.keys('rec:').map(k => LS.get(k, null)).filter(Boolean);
let recTimer = 0;
function saveRec(now) { clearTimeout(recTimer); const go = () => { if (S.rec) LS.set('rec:' + S.rec.id, S.rec); }; if (now) go(); else recTimer = setTimeout(go, 600); }

async function loadIndex() {
  try {
    const r = await fetch('data/exams/index.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    S.index = await r.json(); S.indexErr = null; LS.set('index', S.index);
  } catch (e) {
    S.index = S.index || LS.get('index', null); S.indexErr = '새 회차 목록을 받지 못했어요(오프라인일 수 있어요).';
  }
}
async function loadExam(entry) {
  if (S.exams.has(entry.id)) return S.exams.get(entry.id);
  const e = await fetchDec(entry.file + '?v=' + encodeURIComponent(S.index.updated || ''));
  S.exams.set(entry.id, e); return e;
}

/* ---------- render shell ---------- */
function render() {
  try {
    const app = $('#app');

function spark(arr) {

  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const l = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="최근 점수 추이"><line class="gd" x1="0" x2="${W}" y1="${ys(60)}" y2="${ys(60)}" stroke-dasharray="3 3"/><path class="ar" d="${d} L ${l[0]} ${H} L ${pts[0][0]} ${H} Z" opacity=".7"/><path class="ln" d="${d}" vector-effect="non-scaling-stroke"/><circle class="dt" cx="${l[0]}" cy="${l[1]}" r="3.5"/></svg><div class="row note" style="justify-content:space-between"><span>최근 ${arr.length}회</span><span>점선 60점</span></div>`;
}

const T = { iv: null, last: 0, n: 0 };
const remaining = () => S.rec ? S.rec.timeLimitMin * 60 - (S.rec.elapsedSec || 0) : 0;
function tickOnce() { if (!S.rec || S.rec.status !== 'active') return; const now = performance.now(); S.rec.elapsedSec = (S.rec.elapsedSec || 0) + (now - T.last) / 1000; T.last = now; }
function startTimer() { stopTimer(); T.last = performance.now(); T.iv = setInterval(tick, 1000); }
function stopTimer() { if (T.iv) { clearInterval(T.iv); T.iv = null; tickOnce(); } }
function tick() {
  if (S.view !== 'exam') return stopTimer();
  tickOnce(); const rem = remaining(); const el = $('#timer'); if (el) { el.textContent = fmtTime(rem); el.classList.toggle('low', rem < 600); }
  if (++T.n % 10 === 0) saveRec(true);
  if (rem <= 0) { toast('시험 시간이 끝나 자동 제출했어요.'); submitExam(); }
}
const WL = { lock: null, want: false };
async function wakeOn() { WL.want = true; try { if ('wakeLock' in navigator && !WL.lock && !document.hidden) { WL.lock = await navigator.wakeLock.request('screen'); WL.lock.addEventListener('release', () => { WL.lock = null; }); } } catch {} }
function wakeOff() { WL.want = false; try { WL.lock && WL.lock.release(); } catch {} WL.lock = null; }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (S.view === 'exam') { tickOnce(); saveRec(true); } }
  else { if (T.iv) T.last = performance.now(); if (WL.want) wakeOn(); if (!S.locked && S.view !== 'exam') loadIndex().then(() => { if (S.view !== 'exam') render(); }); }
});

/* ---------- review ---------- */
function askLink(q, mine) {
  const t = `피부과 전문의 1차 시험 대비 문항이야. 피부과학 7판과 Fitzpatrick 9판 기준으로 정답이 맞는지 확인하고, 핵심 개념을 설명해 줘.\n\n${stemOf(q)}\n${(q.figs || []).map((f, i) => `소견 ${i + 1}(${f.kind}): ${f.desc}`).join('\n')}\n${q.options.map((o, i) => `${LET[i]}) ${o}`).join('\n')}\n표시된 정답: ${LET[q.answer]}) ${q.options[q.answer]}${mine != null && mine !== q.answer ? `\n내가 고른 답: ${LET[mine]}) ${q.options[mine]}` : ''}\n해설: ${q.explanation || ''}`;
  return 'https://claude.ai/new?q=' + encodeURIComponent(t.slice(0, 3500));
}
function renderExpl(q) {
  const basis = (q.kbRef && q.kbRef.length) ? `<div class="rf">근거 · ${esc(q.kbRef.join(' / '))}${q.basis ? ` — ${esc(q.basis)}` : ''}</div>` : '';
  return `<div class="expl">${q.explanation ? `<div class="t">${esc(q.explanation)}</div>` : ''}${q.point ? `<div class="pt">${esc(q.point)}</div>` : ''}${q.ref ? `<div class="rf">참고 · ${esc(q.ref)}</div>` : ''}${basis}</div>`;
}
function badges(q) { return `<span class="badge">${pad(q.ch)} ${esc(chName(q.ch))}</span>${q.srcKid ? '<span class="badge red">기출 사진 변형</span>' : q.novel ? '<span class="badge nov">기출 미출제</span>' : ''}`; }
function renderReview() {
  const r = S.rec, qs = S.qs;
  const wrong = qs.filter(q => !r.excluded[q.id] && r.answers[q.id] !== q.answer);
  const flagged = qs.filter(q => r.flags[q.id]); const excl = qs.filter(q => r.excluded[q.id]);
  const f = S.rf;
  const shown = f === 'wrong' ? wrong : f === 'flag' ? flagged : f === 'excl' ? excl : f.startsWith('ch') ? qs.filter(q => String(q.ch) === f.slice(2)) : qs;
  const cs = Object.entries(r.chapterStats || {}).sort((a, b) => a[0] - b[0]);
  return `<div class="row" style="margin-bottom:16px"><button class="btn ghost sm" data-act="home">← 오늘로</button></div>
  <section class="card score-head"><div><div class="today-date">${esc(r.title)}</div><div class="big-score" style="margin-top:8px">${r.correct}<small> / ${r.graded}</small></div><p class="muted" style="margin:6px 0 0">${r.score}점 · <span class="mono">${fmtTime(r.elapsedSec)}</span> 사용${excl.length ? ` · 오류 처리 ${excl.length}문항 제외` : ''}</p></div>
    <div>${cs.map(([c, [a, t]]) => `<div class="acc-r"><span class="bp-name"><span class="bp-c">${pad(c)}</span> ${esc(chName(c))}</span><span class="bp-bar"><i style="width:${a / t * 100}%"></i><u style="width:${(1 - a / t) * 100}%"></u></span><span class="acc-v">${a}/${t}</span></div>`).join('')}</div></section>
  <div class="filters" style="margin:22px 0 12px">
    <button class="chip" data-act="rf" data-f="wrong" aria-pressed="${f === 'wrong'}">틀린 문항 <b>${wrong.length}</b></button>
    <button class="chip" data-act="rf" data-f="all" aria-pressed="${f === 'all'}">전체 <b>${qs.length}</b></button>

    <select class="sel" id="rf-ch" aria-label="단원으로 보기"><option value="">단원으로 보기</option>${[...new Set(qs.map(q => q.ch))].sort((a, b) => a - b).map(c => `<option value="ch${c}" ${f === 'ch' + c ? 'selected' : ''}>${pad(c)} ${esc(chName(c))}</option>`).join('')}</select></div>
  <section class="card">${shown.length ? shown.map(q => renderReviewQ(q)).join('') : `<div class="empty" style="border:0">${f === 'wrong' ? '틀린 문항이 없어요.' : '해당 문항이 없어요.'}</div>`}</section>`;
}
function renderReviewQ(q) {
  const r = S.rec; const n = S.qs.indexOf(q) + 1; const mine = r.answers[q.id]; const ex = !!r.excluded[q.id]; const ok = mine === q.answer;

}

function exportData() {

  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));

async function importData(file) {
  try {
    const d = JSON.parse(await file.text()); if (!d || !Array.isArray(d.recs)) throw 0;
    for (const r of d.recs) { const cur = recOf(r.id); if (!cur || (cur.status !== 'done' && r.status === 'done')) LS.set('rec:' + r.id, r); }
    const have = new Set(S.notes.map(n => n.id)); for (const n of d.notes || []) if (!have.has(n.id)) S.notes.push(n);
    if (Array.isArray(d.aag)) { d.aag.forEach(id => AG.known.add(id)); agSave(); }
    if (d.cases && typeof d.cases === 'object') { CS.prog = Object.assign({}, CS.prog || LS.get('cases-prog', {}) || {}, d.cases); csSaveProg(); }
    LS.set('notes', S.notes); toast('기록을 가져왔어요.'); render();
  } catch { toast('기록 파일을 읽지 못했어요.'); }
}

/* ---------- At-a-glance 카드노트 (Fitzpatrick 9판 박스 요약) ---------- */
const AAG_V = '2026-11-05a';
const AG = { data: null, err: null, loading: false, q: '', part: '', ch: '', tag: '', unknown: false, view: 'list', flipAll: false, open: new Set(), deck: [], di: 0, dOpen: false, known: new Set(LS.get('aag-known', [])) };
const agSave = () => LS.set('aag-known', [...AG.known]);
const agNorm = s => String(s).toLowerCase().replace(/\s+/g, ' ');
async function loadAag() {
  if (AG.data || AG.loading) return;
  AG.loading = true; AG.err = null;
  try {
    const d = await fetchDec('data/aag.enc?v=' + AAG_V);
    d.cards.forEach(c => { c._s = agNorm([c.front, c.ko, c.cht, ...c.pts].join(' ')); });
    AG.data = d;
  } catch (e) { AG.err = '카드를 불러오지 못했어요 (' + (e && e.message || e) + ').'; }
  AG.loading = false;
  if (S.tab === 'cards' && !S.view) render();
}
function agFiltered() {
  if (!AG.data) return [];
  const q = agNorm(AG.q.trim()), ws = q ? q.split(' ') : [];
  return AG.data.cards.filter(c => (!AG.part || String(c.part) === AG.part) && (!AG.ch || String(c.ch) === AG.ch) &&
    (!AG.tag || c.tag === AG.tag) && (!AG.unknown || !AG.known.has(c.id)) && ws.every(w => c._s.includes(w)));
}
function agPts(pts) {
  return '<ul class="ag-pts">' + pts.map(p => {
    const m = p.match(/^([가-힣·A-Za-z]{1,6}):\s*(.+)$/);
    return m ? `<li><span class="ag-lb">${esc(m[1])}</span><span>${esc(m[2])}</span></li>` : `<li class="nl"><span>${esc(p)}</span></li>`;
  }).join('') + '</ul>';
}
function agCard(c, open) {
  const k = AG.known.has(c.id);
  return `<article class="card ag-card${open ? ' open' : ''}${k ? ' known' : ''}" data-id="${c.id}">
    <button class="ag-face" data-act="ag-flip" aria-expanded="${open}">
      <span class="ag-meta mono"><span>Ch ${c.ch} · p.${c.bp}</span><span class="ag-k">${k ? '외움' : esc(c.tag)}</span></span>
      <h3>${esc(c.front)}</h3>${c.ko ? `<span class="ag-ko">${esc(c.ko)}</span>` : ''}
      <span class="ag-hint">눌러서 뒷면 보기</span>
    </button>
    <div class="ag-back">${agPts(c.pts)}<div class="ag-foot"><button class="ag-mark" data-act="ag-mark">${k ? '외웠어요 ✓' : '외웠어요'}</button></div></div>
  </article>`;
}
function agStats(n) {
  const t = AG.data ? AG.data.cards.length : 0;
  return `<span class="ag-stat" id="ag-stat">보이는 카드 <b>${n}</b> · 외운 카드 <b>${AG.known.size}</b>/<b>${t}</b></span>`;
}
function agBody() {
  const L = agFiltered();
  const meter = `<div class="ag-meter" aria-hidden="true"><i style="width:${(AG.known.size / Math.max(1, AG.data.cards.length) * 100).toFixed(1)}%"></i></div>`;
  if (!L.length) return meter + `<div class="empty" style="margin-top:16px">조건에 맞는 카드가 없어요. 검색어나 필터를 바꿔 보세요.</div>`;
  if (AG.view === 'deck') {
    if (!AG.deck.length) agBuildDeck();
    if (!AG.deck.length) return meter + `<div class="empty" style="margin-top:16px">조건에 맞는 카드가 없어요.</div>`;
    if (AG.di >= AG.deck.length) AG.di = AG.deck.length - 1;
    const c = AG.deck[AG.di];
    return meter + `<div class="ag-deck" id="ag-deck"><span class="note mono">${AG.di + 1} / ${AG.deck.length}</span>${agCard(c, AG.dOpen)}
      <div class="ag-ctl"><button class="btn" data-act="ag-prev">← 이전</button><button class="btn" data-act="ag-shuffle">섞기</button><button class="btn primary" data-act="ag-next">다음 →</button></div>
      <span class="note">카드를 눌러 뒤집고, 좌우로 밀어 넘겨요. 키보드: 스페이스 · ←/→ · K</span></div>`;
  }
  const P = AG.data.parts;
  let h = '', curP = null, curC = null, inGrid = false;
  for (const c of L) {
    if (c.part !== curP) {
      if (inGrid) { h += '</div>'; inGrid = false; }

      h += `<div class="ag-part"><span class="mono">PART ${c.part}</span><b>${esc(p ? p.ko : '')}</b></div>`;
      curP = c.part; curC = null;
    }

      if (inGrid) h += '</div>';
      h += `<div class="ag-chh"><span class="mono">Ch ${c.ch}</span><span>${esc(c.cht)}</span></div><div class="ag-grid">`;
      curC = c.ch; inGrid = true;
    }
    h += agCard(c, AG.flipAll || AG.open.has(c.id));
  }
  if (inGrid) h += '</div>';
  return meter + h;
}
function agBuildDeck(keep) {
  const cur = keep && AG.deck[AG.di] && AG.deck[AG.di].id;
  AG.deck = agFiltered();
  AG.di = cur ? Math.max(0, AG.deck.findIndex(c => c.id === cur)) : 0;

}

  mark(t) { const n = Number(t.dataset.n); setAnswer(n, Number(t.dataset.i)); if (n !== S.qi) gotoQ(n); },
  goto(t) { gotoQ(Number(t.dataset.n)); ACT['omr-close'](); },
  prev() { gotoQ(S.qi - 1); }, next() { gotoQ(S.qi + 1); },
  flag() { const q = S.qs[S.qi]; if (S.rec.flags[q.id]) delete S.rec.flags[q.id]; else S.rec.flags[q.id] = true; saveRec(); $('#paper').innerHTML = renderPaper(); hydrateImages($('#paper')); paintAfterAnswer(); const r = document.querySelector(`.or[data-row="${S.qi}"]`); if (r) r.classList.toggle('flag', !!S.rec.flags[q.id]); },
  'omr-open'() { $('#omr').classList.add('open'); $('#omr-bd').classList.add('open'); const row = document.querySelector(`.or[data-row="${S.qi}"]`), body = $('#omr-body'); if (row && body) body.scrollTop = Math.max(0, row.offsetTop - body.offsetTop - 80); },
  'omr-close'() { const o = $('#omr'); if (o) o.classList.remove('open'); const b = $('#omr-bd'); if (b) b.classList.remove('open'); },
  exit() { tickOnce(); stopTimer(); wakeOff(); saveRec(true); S.view = null; S.tab = 'today'; render(); toast('저장했어요. 이어서 풀면 남은 시간부터 다시 시작해요.'); },
  'submit-ask'() {
    const un = S.qs.filter(q => S.rec.answers[q.id] === undefined).length, fl = S.qs.filter(q => S.rec.flags[q.id]).length;
    showModal(`<div class="dlg" role="dialog" aria-modal="true"><h3>답안을 제출할까요?</h3><p class="muted" style="margin:0">${un ? `답하지 않은 문항 <b>${un}</b>개` : '모든 문항에 답했어요'}${fl ? `, 표시한 문항 <b>${fl}</b>개` : ''}가 있어요. 제출하면 바로 채점됩니다.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="modal-close">계속 풀기</button><button class="btn primary" data-act="submit">제출하고 채점</button></div></div>`);
  },
  submit() { submitExam(); },
  'modal-close'() { hideModal(); },
  zoom(t) { if (t.dataset.src) showModal(`<div class="dlg img"><button class="btn sm" data-act="modal-close">닫기</button><img src="${esc(t.dataset.src)}" alt="확대한 사진"></div>`); },
  rf(t) { S.rf = t.dataset.f; render(); },
  exclude(t) { const id = t.dataset.q; if (S.rec.excluded[id]) delete S.rec.excluded[id]; else S.rec.excluded[id] = true; grade(); saveRec(true); const y = scrollY; render(); scrollTo(0, y); },
  nf(t) { S.nf = t.dataset.v; render(); },
  'n-pick'(t) { S.nPick[t.dataset.id] = Number(t.dataset.i); const y = scrollY; render(); scrollTo(0, y); },
  'n-reset'(t) { delete S.nPick[t.dataset.id]; const y = scrollY; render(); scrollTo(0, y); },
  'n-del'(t) { S.notes = S.notes.filter(n => n.id !== t.dataset.id); LS.set('notes', S.notes); const y = scrollY; render(); scrollTo(0, y); },
  export() { exportData(); },
  lock() { LS.del('key'); KEY = null; S.locked = true; render(); },
  'img-retry'() { if (S.view === 'exam') { $('#paper').innerHTML = renderPaper(); hydrateImages($('#paper')); } else render(); },
};
Object.assign(ACT, AG_ACT, CS_ACT);
document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t || t.disabled) return; const f = ACT[t.dataset.act]; if (f) { e.preventDefault(); f(t, e); } });
document.addEventListener('submit', e => { if (e.target.id === 'lock-form') { e.preventDefault(); unlock($('#pw').value.trim()); } });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'rf-ch') { if (t.value) { S.rf = t.value; render(); } }
  else if (t.id === 'set-time') { S.settings.timeMin = Math.max(10, Math.min(300, Math.round(Number(t.value) || 100))); LS.set('settings', S.settings); }
  else if (t.id === 'imp' && t.files && t.files[0]) importData(t.files[0]);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) { hideModal(); return; }
  if (S.view !== 'exam' || !$('#modal').hidden || ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
  if (/^[1-5]$/.test(e.key)) setAnswer(S.qi, Number(e.key) - 1);
  else if (e.key === 'ArrowRight') gotoQ(S.qi + 1);
  else if (e.key === 'ArrowLeft') gotoQ(S.qi - 1);
  else if (e.key === 'f' || e.key === 'F') ACT.flag();
});
let TS = null;
document.addEventListener('touchstart', e => { if (S.view !== 'exam' || e.touches.length !== 1 || !e.target.closest('#paper')) { TS = null; return; } TS = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() }; }, { passive: true });
document.addEventListener('touchend', e => { if (!TS) return; const t = e.changedTouches[0]; const dx = t.clientX - TS.x, dy = t.clientY - TS.y, dt = Date.now() - TS.t; TS = null; if (dt < 700 && Math.abs(dx) > 70 && Math.abs(dy) < 60) gotoQ(S.qi + (dx < 0 ? 1 : -1)); }, { passive: true });

/* ---------- boot ---------- */
async function start() { render(); await loadIndex(); render(); }
(async () => {
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch {} }
  const saved = LS.get('key', null);
  if (saved) { try { KEY = await importKey(b64d(saved)); S.locked = false; } catch { KEY = null; } }
  if (S.locked) render(); else start();
})();
})();

</script>
</body>
